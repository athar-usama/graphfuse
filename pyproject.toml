[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphfuse"
version = "0.1.0"
description = "A custom torch.compile backend that FX-pattern-matches a recurring bias-add / GELU / residual-add epilogue and rewrites it to a hand-written Triton kernel, composing with Inductor for the rest of the graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Usama Athar" }]
keywords = ["pytorch", "torch-compile", "torchdynamo", "torch-fx", "triton", "cuda", "compilers", "gpu-kernels"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "matplotlib>=3.7",
]

[project.scripts]
graphfuse = "graphfuse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphfuse"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B905"]
"src/graphfuse/kernels/*" = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
